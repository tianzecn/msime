# ---------- 审计：改写后的树里不许再出现 ----------

[[audit]]
id = "水杉字样"
regex = '水杉'
# 只放行 GPL 要求的修改声明。
allow_line = '基于水杉输入法（MSIME）修改'

[[audit]]
id = "转义形式的水杉"
regex = '(?i)\\u6c34\\u6749|\\346\\260\\264\\346\\235\\211|%E6%B0%B4%E6%9D%89'

[[audit]]
id = "上游服务主机"
regex = '(?<![\w-])([a-z0-9-]+\.)?msime\.app\b'

[[audit]]
id = "上游更新检查"
regex = 'api\.github\.com/repos/metasequoiaime/msime/'

[[audit]]
id = "上游 macOS 和 iOS 标识"
regex = '(?<![\w-])app\.msime\.(macos|ios|inputmethod|client|signin)\b|com\.metasequoia'

[[audit]]
id = "上游 Apple 团队"
regex = 'LXCL4Z68GU'

[[audit]]
id = "上游 iOS URL scheme"
# 只认 iOS 的三种写法；鸿蒙等非首发平台的 msime:// 本来就不改。
regex = 'fullURLScheme = "msime"|CFBundleURLSchemes: \[msime\]|<string>msime</string>'

[[audit]]
id = "上游 Google 项目"
regex = '237074057301'

[[audit]]
id = "英文全称"
regex = 'Metasequoia IME'

# 和水杉同名的目录会让两者的崩溃记录和统计混在一起。iOS 的相对路径在各自的 App Group 容器里
# （墨采是 group.app.mocai.ios），不会撞车，所以不查。
[[audit]]
id = "与水杉共用的数据目录"
regex = 'Application Support/MSIME|telemetry_support_directory\(\)\?\.join\("MSIME"\)|support\.join\("MSIME"\)|"MSIME/(%@/)?telemetry"'
exclude = ["platforms/ios/**", "platforms/windows/**", "platforms/linux/**", "platforms/android/**", "platforms/harmony/**"]

# ---------- 只在 audit --release 时检查 ----------

# 这是水杉的 Sparkle 公钥。用 Sparkle 的 generate_keys 生成墨采自己的一对，公钥写进这个文件，私钥只放发版环境。
[[release_audit]]
id = "Sparkle 公钥还是水杉的"
regex = 'nbQCVPlpQU41gXudWsKC'

[[release_audit]]
id = "Sparkle appcast 还指向水杉"
regex = 'metasequoiaime/msime/releases/download/macos-appcast'

# ---------- 人工复核：不一定是错，发版前看一遍 ----------

[[review]]
id = "仍指向上游 GitHub（资源包按 SHA-256 固定，词库更新尚无编译期固定）"
regex = 'github(usercontent)?\.com/(repos/)?metasequoiaime/'

[[review]]
id = "独立单词 MSIME（数据目录名等内部名称可以保留，用户看得到的要改）"
regex = '(?<![\w-])MSIME(?![\w.-])'
exclude = ["**/tests/**", "**/*[Tt]est*"]

# ---------- 标志：代码里画的那几份 ----------
# 图片由 brand/art/generate.py 生成、经 [assets] 覆盖；这几处是代码里画的标志，换成同一笔画和配色。
# 坐标由 generate.py 的 STROKE 算出，scripts/test-brand-layer.py 核对这里与它一致：改笔画先改 generate.py，再按它更新这里。

