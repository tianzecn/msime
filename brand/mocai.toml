# 墨采输入法的品牌配置。规则见 brand/README.md，执行者是 brand/apply.py。
#
# Apple 团队和 Google 登录还是占位值，`apply.py audit --release` 在还有占位值时不通过。

[brand]
id = "mocai"
placeholder_patterns = ['\.invalid', 'MOCAITEAM0', 'mocai-placeholder']

[values]
name_zh = "墨采输入法"
short_zh = "墨采"
name_en = "Mocai"
name_en_long = "Mocai IME"
# 标识是域名 mocai.wangpisi.com 倒写。首个正式版发布后不能再改：系统按它认应用，改了用户要重装、设置要重配。
identifier_root = "com.wangpisi.mocai"
keychain_root = "com.wangpisi.mocai.keychain"
url_scheme = "mocai"
site_host = "mocai.wangpisi.com"
# 自建 msime-cloud 的地址；media 放头像（R2 或 S3 的自定义域名），dl 是可选的下载镜像，没部署时客户端退回 GitHub 原地址。
api_host = "api.mocai.wangpisi.com"
media_host = "media.mocai.wangpisi.com"
download_host = "dl.mocai.wangpisi.com"
# 墨采自己的 GitHub 仓库，源码（GPL 第 6 条要公开）和发版放在一起。检查更新解析的是 GitHub Releases 接口的 JSON，
# Sparkle 的 appcast 和更新包也挂在它的 release 上。两项要一起改。
release_repo = "tianzecn/msime"
source_url = "https://github.com/tianzecn/msime"
# 2026-11-04 生成，私钥在维护者登录钥匙串的 mocai-ime 账户和仓库 Secret SPARKLE_ED_PRIVATE_KEY 里。
# 换掉它，已安装的墨采就再也收不到更新，所以私钥要另存一份备份。
sparkle_public_key = "L1eCCUHdvbXhcy+92fi9KKNPCKZJf+coMbbnCOVeD3M="
# 还没加入 Apple Developer Program，先用占位值：TrollStore 的伪签名不校验团队，App 和键盘扩展一致即可。
# 加入后填真实的团队 ID，audit --release 在这之前不通过。
apple_team_id = "MOCAITEAM0"
# Google Cloud 项目 mocai-ime，2026-11-05 建。iOS 客户端按 bundle ID com.wangpisi.mocai.ios 登记；
# 服务端客户端是「Web 应用」类型，iOS 拿它的 ID 当 GIDServerClientID，ID Token 的受众就是它。
# 两个 ID 都要列进墨采云的 auth.google.client_ids。
google_project_number = "397848535684"
# 墨采云的 AI 对话、联想、润色和翻译转给谁（tianzecn/msime-cloud 的 deploy/mocai/config.json）。
# 对话页要如实告诉用户内容交给了谁，换服务商时两边一起改。
backend_ai_provider = "DeepSeek"
google_ios_client = "397848535684-vp5bk1jjio0qa767t4du0csevt9dafc1"
google_server_client = "397848535684-57d5i4o4in9sjehqrmk09v6djlju5gtt"

[scope]
# 这些路径不改写：
# - 许可证和第三方声明必须原样保留（GPL-3.0 第 4、5 条，以及各数据源的署名条款）；
# - 插件和资源锁带内容哈希，改一个字节校验就过不去，而且写着上游作者是事实；
# - 引擎等单独发布的库、文档和决策笔记留在上游原样，文档按 brand/README.md 另写。
exclude = [
  "LICENSE",
  "**/LICENSE*",
  "**/licenses/**",
  "**/Licenses/**",
  "**/NOTICE*",
  "**/*NOTICE*",
  "**/*-Dependencies.txt",
  "**/THIRD_PARTY*",
  "**/*.md",
  "docs/**",
  ".agents/**",
  ".claude/**",
  ".github/**",
  ".oss-scanner/**",
  "develop-docs/**",
  "brand/**",
  "scripts/test-brand-layer.py",
  "resources/**",
  "plugins/**",
  "fuzz/**",
  "tools/**",
  "crates/engine/**",
  "crates/engine-capi/**",
  "crates/engine-wasm/**",
  "crates/path-trust/**",
  "crates/script-sdk/**",
  "crates/script-runtime/**",
  "crates/pack-tool/**",
  "crates/backend-engine/**",
  "crates/dict-builder/**",
  "crates/clipboard-relay/**",
  "packages/web-engine/**",
  "scripts/build-web-engine.sh",
  "scripts/web-engine-notice.sh",
  # 它生成 docs/ 下的页面，而 docs/ 不改写；只改生成器，生成结果就对不上了。
  "scripts/generate_plugin_architecture.py",
  "**/*.lock",
  "**/*.lock.json",
  "pnpm-lock.yaml",
  "flake.*",
]
# resources/ 整体排除，下面这些是其中用户看得到、又不带哈希的文案。
force_include = ["resources/keyboard-skin-presets.json"]

# ---------- 显示名 ----------

[[rules]]
id = "中文全称"
from = "水杉输入法"
to = "${name_zh}"

[[rules]]
id = "吉祥物名"
from = "水杉娘"
to = "墨墨"

[[rules]]
id = "中文简称"
from = "水杉"
to = "${short_zh}"

[[rules]]
id = "转义的中文简称"
regex = '\\u6c34\\u6749'
to = '${short_zh_unicode_escape}'

[[rules]]
id = "百分号编码的中文简称"
regex = '%E6%B0%B4%E6%9D%89'
to = '${short_zh_percent}'

[[rules]]
id = "英文全称"
from = "Metasequoia IME"
to = "${name_en_long}"

[[rules]]
id = "版本表英文名"
regex = '"en": "MSIME'
to = '"en": "${name_en}'
include = ["shared/contracts/**", "scripts/**", "crates/client-core/**", "**/tests/**"]

[[rules]]
id = "设置应用产品名"
regex = '"productName": "MSIME"'
to = '"productName": "${name_en}"'

[[rules]]
id = "设置应用包名"
regex = '\bMSIME\.app\b'
to = '${name_en}.app'

[[rules]]
id = "英文账号文案"
regex = '\bMSIME account\b'
to = '${name_en} account'

# AI 助手的系统提示词写着产品的别名，用户问起来它会照说。
[[rules]]
id = "提示词里的别名"
from = "（MSIME，"
to = "（"

[[rules]]
id = "界面字面量"
regex = 'Text\("MSIME"\)'
to = 'Text("${name_en}")'

[[rules]]
id = "界面引用的英文名"
from = "「MSIME」"
to = "「${name_en}」"

[[rules]]
id = "版本表英文名断言"
from = 'display_name.en, "MSIME"'
to = 'display_name.en, "${name_en}"'

[[rules]]
id = "Homebrew 显示名"
regex = '(name "|Open )MSIME\b'
to = '\g<1>${name_en}'
include = ["platforms/macos/homebrew/**"]

[[rules]]
id = "InfoPlist 注释里的包名"
from = "bundle's file name, MSIME,"
to = "bundle's file name, ${name_en},"

# 崩溃记录和使用统计的目录。和水杉同名的话，两者装在同一台 Mac 上时，墨采的记录会进水杉的上报队列。
[[rules]]
id = "版本表检查里的统计目录"
from = 'f"MSIME/{edition_id}/telemetry"'
to = 'f"${name_en}/{edition_id}/telemetry"'
include = ["scripts/test-editions.py"]

[[rules]]
id = "macOS 崩溃目录（Rust）"
regex = 'join\("MSIME"\)'
to = 'join("${name_en}")'
include = [
  "apps/desktop/src-tauri/src/platform/desktop/**",
  "crates/mcp-server/src/crash_reporting.rs",
]

[[rules]]
id = "macOS 崩溃目录（完整路径）"
regex = 'Application Support/MSIME'
to = 'Application Support/${name_en}'

[[rules]]
id = "macOS 统计目录"
regex = '"MSIME(/telemetry"|/%@/telemetry"|/[a-z]+/telemetry")'
to = '"${name_en}\g<1>'
include = [
  "platforms/macos/src/core/EditionIdentity.h",
  "platforms/macos/tests/**",
  "scripts/test-editions.py",
]

[[rules]]
id = "macOS 崩溃目录（语音助手测试）"
from = 'support / "MSIME"'
to = 'support / "${name_en}"'
include = ["platforms/macos/tests/voice/helper_crash_capture.py"]

# ---------- macOS 与 iOS 的系统身份 ----------
# Android、Windows、Linux、鸿蒙不在首发范围：Android 的 Java 包名和 JNI 符号也用 app.msime，
# 只改字符串会让它们编不过。轮到这些平台时再扩这几条规则。

[[rules]]
id = "输入法 bundle id"
from = "app.msime.inputmethod.MetasequoiaIME"
to = "${identifier_root}.inputmethod.MocaiIME"

[[rules]]
id = "其余 app.msime 标识"
regex = '(?<![\w-])(group\.)?app\.msime\.(?!android|windows|linux|hmos)'
to = '\g<1>${identifier_root}.'

# 版本表的 schema 把标识写成正则，点是转义过的，上一条匹配不到。
[[rules]]
id = "正则写法的 app.msime 标识"
regex = 'app(\\+)\.msime\\+\.(?!android|windows|linux|hmos)'
to = '${identifier_root_regex}\g<1>.'

[[rules]]
id = "钥匙串服务名"
from = "com.metasequoia.msime"
to = "${keychain_root}"

[[rules]]
id = "iOS URL scheme"
regex = '\bmsime://'
to = '${url_scheme}://'
include = ["platforms/ios/**", "shared/**"]

[[rules]]
id = "iOS URL scheme 声明"
regex = '(CFBundleURLSchemes: \[|<string>)msime(\]|</string>)'
to = '\g<1>${url_scheme}\g<2>'
include = ["platforms/ios/project.yml", "platforms/ios/App/Resources/Info.plist", "platforms/ios/tests/**"]

# 键盘拉起 App（语音会话、设置、词库、常用语、反馈）和 App 认链接都用这个常量拼 scheme，
# 它是裸字符串，上面两条都匹配不到。漏掉时 Info.plist 注册的是 mocai，键盘却去开 msime://，
# 长按空格提示「未能打开墨采」；装着水杉时还会拉起水杉。上游测试同样断言 "msime"，契约对比看不出来，所以另有审计。
[[rules]]
id = "iOS URL scheme 常量"
regex = '(fullURLScheme = ")msime(")'
to = '\g<1>${url_scheme}\g<2>'
include = ["shared/backend/account/BackendAccountClient.swift", "platforms/ios/tests/**"]

[[rules]]
id = "Apple 团队"
from = "LXCL4Z68GU"
to = "${apple_team_id}"

[[rules]]
id = "Google 登录 iOS 客户端"
from = "237074057301-dam9p3icuapsr31tv85q35gn4erm1kmt"
to = "${google_ios_client}"

[[rules]]
id = "Google 登录服务端客户端"
from = "237074057301-q5av9h30kspkqnjat4i9hn9oer9ogfpp"
to = "${google_server_client}"

[[rules]]
id = "Google 项目号"
from = "237074057301"
to = "${google_project_number}"

# ---------- 服务地址 ----------

[[rules]]
id = "API 主机"
regex = '\bapi\.msime\.app\b'
to = "${api_host}"

[[rules]]
id = "媒体主机"
regex = '\bmedia\.msime\.app\b'
to = "${media_host}"

[[rules]]
id = "下载镜像主机"
regex = '\bdl\.msime\.app\b'
to = "${download_host}"

[[rules]]
id = "官网主机"
regex = '(?<![\w.-])msime\.app\b'
to = "${site_host}"

[[rules]]
id = "更新检查"
regex = 'https://api\.github\.com/repos/metasequoiaime/msime/releases'
to = "https://api.github.com/repos/${release_repo}/releases"

# 下一条规则不动 releases/download，因为那里大多是按 SHA-256 固定的资源包（onnxruntime-minimal、voice-runtime、
# ocr-module）。这几个 tag 是墨采自己的发版产物：留着上游地址，墨采会去读水杉的更新源，发版脚本前后也对不上。
[[rules]]
id = "墨采自己的发版产物"
regex = 'https://github\.com/metasequoiaime/msime/releases/download/(?=macos-appcast|macos-v|macos-symbols|ios-v|nightly|\$release/)'
to = "https://github.com/${release_repo}/releases/download/"

# 发版脚本的测试夹具只写前缀，tag 在后面拼，上一条的前瞻匹配不到；它只模拟墨采自己的发版产物。
[[rules]]
id = "macOS 发版测试的下载前缀"
from = '"https://github.com/metasequoiaime/msime/releases/download/"'
to = '"https://github.com/${release_repo}/releases/download/"'
include = ["scripts/test-macos-release-extras.py"]

[[rules]]
id = "iOS 的电脑版下载链接"
from = 'https://github.com/metasequoiaime/\(repository)/releases'
to = "https://github.com/${release_repo}/releases"

# releases/download 下是按 SHA-256 固定的资源包，继续从上游下载；其余的页面链接换成墨采自己的。
[[rules]]
id = "源码与反馈链接"
regex = 'https://github\.com/metasequoiaime/msime(?![-\w])(?!/releases/download)'
to = "${source_url}"

